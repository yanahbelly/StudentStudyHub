<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - StudentStudyHub</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- If already logged in → go Home -->
    <script>
        if (localStorage.getItem('studyhub_user')) {
            window.location.href = 'index.html';
        }
    </script>
</head>
<body class="auth-page">
    <nav class="navbar">
        <div class="logo">StudentStudyHub</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="ai-chat.html">AI Assistant</a>
            <a href="login.html" class="active">Login</a>
        </div>
    </nav>

    <main class="auth-container">
        <div class="auth-card compact-card">
            <h2>🔐 Sign In</h2>
            <p class="auth-subtitle">Welcome back!</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username" required autocomplete="off">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Enter your password" required>
                        <button type="button" class="toggle-password" id="toggleLoginPass">👁️</button>
                    </div>
                </div>

                <p id="errorBox" class="error-msg"></p>
                <button type="submit" class="btn-primary full-width">Login</button>
            </form>

            <p class="auth-switch">
                Don't have an account yet? <a href="signup.html">Sign Up →</a>
            </p>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
